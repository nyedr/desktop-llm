name: desktop-llm
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip>=23.0
  - pip:
      # Core Dependencies
      - fastapi>=0.104.1
      - uvicorn>=0.24.0
      - pydantic>=2.4.2
      - pydantic-settings>=2.0.3

      # Deep Learning
      - --extra-index-url https://download.pytorch.org/whl/cu118
      - torch
      - torchaudio
      - torchvision

      # Streaming and Real-time
      - sse-starlette>=1.6.5
      - websockets>=12.0

      # Dependency Injection and Configuration
      - dependency-injector>=4.41.0
      - python-dotenv>=1.0.0

      # AI and Machine Learning
      - openai>=1.3.5
      - transformers>=4.35.2
      - tiktoken>=0.5.1
      - ollama>=0.1.6
      - langchain-core>=0.3.21
      - langchain>=0.1.0
      - langchain-community>=0.0.24
      - sentence-transformers>=2.2.2
      - chromadb>=0.4.20

      # HTTP and API
      - httpx>=0.25.1
      - requests>=2.31.0
      - aiohttp>=3.9.1

      # Caching and Performance
      - aiocache>=0.12.2
      - redis>=5.0.1

      # Utility Libraries
      - tenacity>=8.2.2
      - typing-extensions>=4.7.0
      - structlog>=23.2.0

      # Testing and Development
      - pytest>=7.4.3
      - pytest-asyncio>=0.21.1
      - pytest-cov>=4.1.0
      - black>=23.11.0
      - isort>=5.12.0
      - mypy>=1.7.1
      - slowapi>=0.1.9
      - jsonschema>=4.17.3
      - psutil>=5.9.5
      - pytest-xdist

      # Web Scraping
      - markdownify>=0.11.6

      # NLP and Entity Recognition
      - spacy>=3.7.2
      - aioboto3>=13.3.0

      # File Processing
      - textract==1.5.0

      # Memory
      - git+https://github.com/nyedr/LightRAG.git
      - nano_vectordb>=0.0.4.3

      # Audio Processing
      - librosa>=0.10.1
      - soundfile>=0.12.1
      - scipy>=1.11.4
      - ffmpeg-python>=0.2.0
      - pydub>=0.25.1
      - pyaudioanalysis>=0.3.14
      - openai-whisper>=20231117
      - transformers[torch-speech]>=4.35.2
      - numpy
